[Flask]
flask_run_port = 5000
# CSRF related
flask_secret_key = 174558bb5d7908e0890b7054863acaff1fe997d55debff6553e50534f81a7a85
scanner_poll_interval = 15s
bg_client_idle_timeout = 1m
scanner_interval_seconds = 1m
setups_dir = setups

[IBKR]
# IBKR app api ports and mode (LIVE - PAPER)
api_live_port = 7496
api_paper_port = 7497
api_mode = PAPER

# DISABLED: Contract cache writes are disabled to stabilize the core app
# Cache reads are still allowed for performance, but no writes occur
# This prevents file I/O overhead and potential cache inconsistencies
enable_contract_cache = false

# Local contracts cache location (read-only)
cache_path = ibkr_cache.json

# Local contracts cache expiry
contract_cache_ttl_sec = 300

# how long to wait for contractDetailsEnd
contract_lookup_timeout_sec = 10
contract_lookup_poll_sec = 0.1

# how many times to retry contract lookup (CUSIP / symbol)
contract_lookup_max_attempts = 2

# how long to wait for historical data
history_lookup_timeout_sec = 30
history_lookup_poll_sec = 0.1

# how long to wait for top movers
movers_timeout_sec = 30

# multiply volume by x100 ; true/false
scale_volume_metrics = true

# force minimum volume for the scanner ; true/false ; changed true to false 3/9 supposed to bring all stock top 50
force_min_volume = false

# run gc.collect() across the code ; true/false
# DISABLED: Memory garbage collection disabled during stability focus
# Re-enable after core app and news scanning are fully stable
cache_garbage_collection = false

# Scanner universe configuration.
#
# "STK.US" includes ALL US tradable equities available via IB,
# including NYSE, NASDAQ, ARCA, regional exchanges, and OTC/pink sheets.
# This can result in low-liquidity microcaps and extreme penny-stock movers
# dominating percentage-based scans (e.g., TOP_PERC_GAIN).
#
# Switching to "STK.US.MAJOR" restricts the universe to major
# exchange-listed equities (NYSE, NASDAQ, NYSE American, etc.),
# excluding most OTC and pink sheet securities.
#
# This improves signal quality, liquidity consistency, and reduces
# noise from thinly traded microcaps without altering indicator logic.
#
# IMPORTANT:
# This only affects the scanner universe — it does NOT modify
# indicator calculations, timeframe handling, or historical data logic.
#
# If broader coverage (including OTC) is required in the future,
# revert to "STK.US".
location_code = STK.US.MAJOR
